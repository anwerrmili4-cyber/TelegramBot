line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long — à corriger progressivement
    "E402",   # module-import-not-at-top — nécessaire pour certains imports conditionnels
    "SIM108", # if-else-block-instead-of-if-exp — les ternaires imbriqués se lisent moins bien
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
