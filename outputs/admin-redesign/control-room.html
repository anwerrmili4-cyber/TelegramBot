<style>
:root{--bg:#f4f5ef;--card:#fff;--ink:#20251e;--muted:#74796f;--line:#e5e7df;--accent:#d9f780;--soft:#eff4e5;--nav:#20271f;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,sans-serif}body.dark{--bg:#171d17;--card:#222a22;--ink:#eef2e8;--muted:#a2af9e;--line:#394438;--soft:#35432b}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #71a530;outline-offset:4px}button{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--card)}button:hover{filter:brightness(.96)}a{color:inherit}aside{width:238px;position:fixed;inset:0 auto 0 0;background:var(--nav);color:#f2f4ee;padding:28px 18px;display:flex;flex-direction:column;z-index:20}.brand{font-size:20px;letter-spacing:-.8px;font-weight:750;display:flex;align-items:center;gap:12px}.mark{background:var(--accent);color:#20271f;display:grid;place-items:center;width:35px;height:35px;border-radius:10px}.workspace{border:1px solid #414b3e;padding:12px;margin:30px 0 20px;border-radius:10px;font-size:12px;color:#cad2c4}.workspace strong{display:block;color:white;font-size:14px}.navgroup{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#9ba893;margin:18px 12px 9px}nav{overflow:auto}nav button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;background:none;color:#c4cdbf;border:0;text-align:left;margin:3px 0;font-size:13px}nav button.active{background:var(--accent);color:#26321b;font-weight:650}nav button span:first-child{font-size:17px;width:20px}.profile{margin-top:auto;padding:22px 10px 0;border-top:1px solid #414b3e;font-size:12px}.profile small{display:block;color:#9ba893}.main{margin-left:238px}header{height:82px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 38px;border-bottom:1px solid var(--line)}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-weight:500}.head-actions{display:flex;gap:10px;align-items:center}.tag{font-size:10px;letter-spacing:.8px;text-transform:uppercase;background:var(--soft);border:1px solid var(--line);padding:6px 10px;border-radius:6px;color:var(--muted)}main{max-width:1550px;margin:auto;padding:34px 38px 50px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:35px;line-height:1.15;letter-spacing:-1.3px;margin:8px 0 10px;font-weight:650}h2{font-size:16px;letter-spacing:-.4px;margin:0}h3{font-size:14px;margin:0}.muted{color:var(--muted)}p{margin:7px 0}.primary{background:var(--accent);border-color:var(--accent);color:#253219;font-weight:600}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:21px;text-align:left;transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-3px);box-shadow:0 8px 18px #00000008}.stat .label{color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.stat strong{display:block;font-size:30px;letter-spacing:-1px;font-weight:600;margin:14px 0 5px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:11px}.stat .unit{font-size:13px;color:var(--muted);font-weight:400}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px;margin-bottom:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.chart{height:185px;display:flex;gap:14px;align-items:stretch;margin-top:25px}.bar-cell{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px;font-size:10px;color:var(--muted)}.bar{width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:var(--soft);min-height:4px;animation:grow .6s ease both;transform-origin:bottom}.bar-cell:last-child .bar{background:var(--accent)}.chart-note{font-size:10px;margin-top:18px;color:var(--muted)}.task{display:flex;gap:12px;align-items:center;padding:17px 0;border-top:1px solid var(--line)}.task .bubble{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}.task p{font-size:11px;color:var(--muted);margin:4px 0 0}.task button{margin-left:auto;border:0;padding:8px;background:transparent}.task h3{font-weight:550}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;color:var(--muted);padding:12px;border-bottom:1px solid var(--line)}td{padding:15px 12px;border-bottom:1px solid var(--line);font-size:12px}tbody tr:last-child td{border:0}tbody tr:hover{background:var(--soft)}td button{font-size:11px;padding:5px 9px}td strong{font-weight:600}.status{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:5px;padding:4px 8px;font-size:10px;color:var(--ink)}.status.wait{background:#fff0d4;color:#886321}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}input{min-width:220px}.filters input{flex:1}.footer-note{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:24px;gap:20px}.menu{display:none}.page{animation:enter .22s ease}dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:30px;width:min(520px,calc(100% - 32px))}dialog::backdrop{background:#101b1280;backdrop-filter:blur(3px)}dialog .close{float:right}dialog h2{font-size:23px;margin:18px 0}dialog dl{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}dialog dt{color:var(--muted)}dialog dd{margin:0}.notice{padding:15px;background:var(--soft);border-radius:10px;font-size:12px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:1150px){aside{width:210px}.main{margin-left:210px}header{padding:0 24px}main{padding:28px 24px}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:25px}.grid{grid-template-columns:1.4fr 1fr}}@media(max-width:850px){aside{transform:translateX(-100%);transition:transform .2s}aside.open{transform:none;box-shadow:0 0 0 100vmax #0007}.main{margin:0}.menu{display:block}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.heading{align-items:flex-start}.crumb{display:none}h1{font-size:30px}}@media(max-width:480px){main{padding:25px 16px}header{padding:0 16px;height:70px}.head-actions .tag{display:none}.heading{display:block}.heading>button{margin-top:10px}.panel{padding:17px}.stat strong{font-size:25px}.stat{padding:15px}.footer-note{flex-direction:column;gap:8px}.chart{gap:10px}.head-actions button{padding:9px}.panel-top{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<aside id="sidebar"><div class="brand"><span class="mark">↗</span>black market<span style="color:#9ba893;font-weight:400">.</span></div><div class="workspace"><span>ESPACE DE TRAVAIL</span><strong>Commerce Telegram</strong><span>Bot principal · proposition</span></div><nav aria-label="Navigation de la maquette">
<div class="navgroup">Pilotage</div><button data-page="overview" class="active"><span>▦</span>Vue d’ensemble</button><button data-page="orders"><span>▤</span>Commandes</button><button data-page="catalog"><span>◇</span>Catalogue & stock</button><button data-page="customers"><span>♧</span>Clients</button>
<div class="navgroup">Opérations</div><button data-page="finance"><span>↔</span>Finance</button><button data-page="support"><span>◉</span>Support</button><button data-page="bots"><span>⌘</span>Bots & intégrations</button>
<div class="navgroup">Administration</div><button data-page="data"><span>▧</span>Données & audit</button><button data-page="content"><span>≡</span>Contenu du site</button><button data-page="access"><span>⚿</span>Accès & paramètres</button></nav><div class="profile">◉ &nbsp; Espace propriétaire<small>Maquette · aucune session réelle</small></div></aside>
<div class="main"><header><button class="menu" id="menu" aria-label="Ouvrir le menu" aria-expanded="false">☰</button><div class="crumb">Espace de travail &nbsp; / &nbsp; <b id="breadcrumb">Vue d’ensemble</b></div><div class="head-actions"><span class="tag">Prototype · données fictives</span><button id="theme" aria-label="Changer le thème">◐ &nbsp; Thème</button><a href="AUDIT-ET-PLAN.md">Lire l’audit ↗</a></div></header><main id="app"></main></div>
<dialog id="detail" aria-labelledby="dialog-title"><button class="close" id="close" aria-label="Fermer le détail">✕</button><div class="eyebrow">Aperçu du parcours</div><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog>
<script>
const orders=[{id:'1048',name:'Camille D.',product:'Abonnement créatif',amount:24,status:'À vérifier'},{id:'1047',name:'Alex M.',product:'Outil de productivité',amount:18,status:'Livrée'},{id:'1046',name:'Sam R.',product:'Licence design',amount:36,status:'Livrée'},{id:'1045',name:'Lou A.',product:'Abonnement créatif',amount:24,status:'En préparation'}];
const names={overview:'Vue d’ensemble',orders:'Commandes',catalog:'Catalogue & stock',customers:'Clients',finance:'Finance',support:'Support',bots:'Bots & intégrations',data:'Données & audit',content:'Contenu du site',access:'Accès & paramètres'};
const modules={catalog:{intro:'Des produits, des disponibilités et des fournisseurs réunis.',items:[['Catalogue','Services, offres, tarifs et variantes.'],['Inventaire','Stock masqué, disponibilité et historique des réservations.'],['Fournisseurs','Catalogue externe, prix et diagnostics configurés.']]},customers:{intro:'Une fiche complète pour chaque relation client.',items:[['Fiche client','Commandes, tickets, portefeuille et historique.'],['Segmentation','Filtres sauvegardés et export de la sélection.'],['Modération','État du compte et décisions tracées.']]},finance:{intro:'Chaque mouvement doit pouvoir être expliqué.',items:[['Dépôts à vérifier','Contrôle de la référence et décision explicite.'],['Portefeuilles','Mouvements, ajustements motivés et solde.'],['Remboursements & retraits','Suivi des demandes et rapprochement des opérations.']]},support:{intro:'Le contexte client, à côté de chaque conversation.',items:[['Boîte de réception','Tickets ouverts, filtres et historique.'],['Réponse','Message, pièce de contexte et statut de la demande.'],['Garanties','Éligibilité, commande associée et résolution.']]},bots:{intro:'Un état mesuré et des actions clairement séparées.',items:[['Bot principal','Identité, dernière vérification et maintenance.'],['Diagnostic Telegram','Lecture seule de l’état du webhook et des erreurs.'],['Intégrations','Fournisseurs, clés API et connecteurs configurés.']]},data:{intro:'Explorer, comprendre et administrer les données métier.',items:[['Explorateur','Collections autorisées, filtres, relations et pagination.'],['Journal des actions','Acteur, date, ancienne valeur et nouvelle valeur.'],['Exports & sauvegardes','Sélection, masquage et historique des traitements.']]},content:{intro:'Un même langage visuel, du site public au panneau.',items:[['Accueil','Identité, catalogue Telegram et liens de support.'],['Conditions générales','Édition, aperçu et versions publiées.'],['Confidentialité','Page à créer, versionner et relier au pied de page.']]},access:{intro:'Tous les droits du propriétaire, des accès précis pour l’équipe.',items:[['Équipe & rôles','Propriétaire, opérations, finance, support et lecture seule.'],['Sessions','Appareils, expiration et révocation.'],['Paramètres','Identité et règles validées côté serveur.']]}};
let active='overview'; const app=document.querySelector('#app'),dialog=document.querySelector('#detail');
function heading(title,description,action=''){return `<div class="heading"><div><div class="eyebrow">Control Room / ${active==='overview'?'01 — Pilotage':'Espace de travail'}</div><h1>${title}</h1><p class="muted">${description}</p></div>${action}</div>`}
function table(rows){return `<div class="table-scroll"><table><thead><tr><th>Commande</th><th>Client / produit</th><th>Montant</th><th>Statut</th><th>Détail</th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>#${o.id}</strong></td><td>${o.name}<br><small class="muted">${o.product}</small></td><td>${o.amount.toFixed(2)} USDT</td><td><span class="status ${o.status==='À vérifier'?'wait':''}">● ${o.status}</span></td><td><button data-order="${o.id}" aria-label="Voir commande ${o.id}">Ouvrir ↗</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Aucune commande de démonstration ne correspond.</div>'}</div>`}
function overview(){return heading('Votre activité, en un regard.','Les priorités du jour. Le contexte pour agir.', '<button class="primary" data-go="orders">Voir les commandes ↗</button>')+`<div class="stats"><button class="stat" data-go="finance"><span class="label">Revenus de démonstration <span>↗</span></span><strong>1 284 <span class="unit">USDT</span></strong><small>Exemple visuel · période fictive</small></button><button class="stat" data-go="orders"><span class="label">Commandes <span>▤</span></span><strong>48</strong><small>Exemple de mesure agrégée</small></button><button class="stat" data-go="customers"><span class="label">Clients actifs <span>♧</span></span><strong>126</strong><small>Exemple de segment client</small></button><button class="stat" data-go="support"><span class="label">À traiter <span>◷</span></span><strong>07</strong><small>Exemple de file de travail</small></button></div><div class="grid"><section class="panel"><div class="panel-top"><div><h2>Une activité qui se dessine</h2><p class="muted" style="font-size:11px">Volume quotidien · illustration de la future série réelle</p></div><span class="tag">7 jours / démo</span></div><div class="chart" role="img" aria-label="Graphique fictif de démonstration : lundi 8, mardi 13, mercredi 10, jeudi 17, vendredi 14, samedi 22, dimanche 19">${[8,13,10,17,14,22,19].map((v,i)=>`<div class="bar-cell"><span>${v}</span><div class="bar" style="height:${v*5}px;animation-delay:${i*35}ms"></div><span>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]}</span></div>`).join('')}</div><div class="chart-note">Données fictives. En production : agrégation serveur datée, sans estimation.</div></section><section class="panel"><div class="panel-top"><h2>Votre file de travail</h2><span class="tag">Exemples</span></div>${[['finance','↔','Vérifier les dépôts','Une référence, une décision tracée.'],['catalog','◇','Anticiper le stock faible','Ouvrir les disponibilités par offre.'],['support','◉','Répondre aux clients','Conserver le contexte de commande.']].map(([p,i,t,d])=>`<div class="task"><span class="bubble">${i}</span><div><h3>${t}</h3><p>${d}</p></div><button data-go="${p}" aria-label="Ouvrir ${t}">↗</button></div>`).join('')}</section></div><section class="panel"><div class="panel-top"><div><h2>Dernières commandes</h2><p class="muted" style="font-size:11px">Exemples de fiches et de statuts</p></div><button data-go="orders">Tout consulter →</button></div>${table(orders)}</section>`}
function render(page){active=names[page]?page:'overview';document.querySelector('#breadcrumb').textContent=names[active];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===active);if(b.dataset.page===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('#sidebar').classList.remove('open');document.querySelector('#menu').setAttribute('aria-expanded','false');if(active==='overview')app.innerHTML=overview();else if(active==='orders')app.innerHTML=heading('Commandes','Rechercher, filtrer et ouvrir une fiche de démonstration.')+`<section class="panel"><div class="filters"><input id="search" type="search" aria-label="Rechercher une commande" placeholder="Rechercher un numéro, client ou produit…"><select id="status" aria-label="Filtrer le statut"><option>Tous les statuts</option><option>À vérifier</option><option>Livrée</option><option>En préparation</option></select><button id="export">Exporter la sélection</button></div><div id="results">${table(orders)}</div></section>`;else{const m=modules[active];app.innerHTML=heading(names[active],m.intro)+`<div class="notice" style="margin-bottom:22px">Architecture proposée · les outils ci-dessous décrivent les parcours à réaliser. Aucun accès à la base ou à Telegram dans cette maquette.</div><div class="grid">${m.items.map(([t,d],i)=>`<section class="panel"><div class="eyebrow">0${i+1} / ${names[active]}</div><h2 style="font-size:24px;margin:18px 0 10px">${t}</h2><p class="muted">${d}</p><button data-feature="${i}" style="margin-top:25px">Voir le parcours prévu ↗</button></section>`).join('')}</div>`}app.insertAdjacentHTML('beforeend','<div class="footer-note"><span>BLACK MARKET / DESIGN PROPOSAL 01</span><span>Prototype local · aucune donnée réelle · septembre 2026</span></div>');app.classList.remove('page');void app.offsetWidth;app.classList.add('page')}
function show(title,body){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;dialog.showModal()}
function filtered(){const q=document.querySelector('#search').value.trim().toLowerCase(),s=document.querySelector('#status').value;return orders.filter(o=>`${o.id} ${o.name} ${o.product}`.toLowerCase().includes(q)&&(s==='Tous les statuts'||o.status===s))}
document.addEventListener('click',e=>{const go=e.target.closest('[data-page],[data-go]');if(go){location.hash=go.dataset.page||go.dataset.go;return}const order=e.target.closest('[data-order]');if(order){const o=orders.find(v=>v.id===order.dataset.order);show(`Commande #${o.id}`,`<span class="status">${o.status}</span><dl><dt>Client</dt><dd>${o.name}</dd><dt>Produit</dt><dd>${o.product}</dd><dt>Montant</dt><dd>${o.amount} USDT</dd></dl><div class="notice">Fiche de démonstration. Le panneau final regroupera paiement, livraison, notes et journal ; chaque action sera reliée au service métier.</div>`)}const feature=e.target.closest('[data-feature]');if(feature){const [t,d]=modules[active].items[Number(feature.dataset.feature)];show(t,`<p>${d}</p><ol><li>Consulter les données et leur fraîcheur.</li><li>Ouvrir l’entité et vérifier le contexte.</li><li>Prévisualiser l’action autorisée.</li><li>Afficher le résultat serveur et sa trace dans le journal.</li></ol><div class="notice">Parcours proposé, connexion API à implémenter. Consulter l’audit pour les dépendances et critères de validation.</div>`)}if(e.target.id==='export'){const rows=filtered(),csv='Commande,Client,Produit,Montant USDT,Statut\n'+rows.map(o=>[o.id,o.name,o.product,o.amount,o.status].join(',')).join('\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='commandes-DEMONSTRATION.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
app.addEventListener('input',e=>{if(e.target.id==='search')document.querySelector('#results').innerHTML=table(filtered())});app.addEventListener('change',e=>{if(e.target.id==='status')document.querySelector('#results').innerHTML=table(filtered())});document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#menu').onclick=()=>{const open=document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#menu').setAttribute('aria-expanded',String(open))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('#sidebar').classList.remove('open');document.querySelector('#menu').setAttribute('aria-expanded','false')}});window.addEventListener('hashchange',()=>render(location.hash.slice(1)));render(location.hash.slice(1)||'overview');
</script></body></html>
