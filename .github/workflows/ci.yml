name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest ruff mongomock pip-audit

    - name: Check compilation syntax
      run: python -m compileall . -q -x '(node_modules|dist|\.venv)'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: storefront/package-lock.json

    - name: Build the storefront served by the Python tests
      working-directory: storefront
      run: |
        npm ci
        npm run build

    - name: Run Ruff Linter
      run: python -m ruff check .

    - name: Run pytest suites
      run: python -m pytest -q

    - name: Audit Python dependencies
      run: python -m pip_audit -r requirements.txt

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: admin-ui/package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run build

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: storefront/package-lock.json
    - run: npm ci
    - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, admin-ui, storefront]
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build the Railway image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
